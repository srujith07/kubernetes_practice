apiVersion: v1
kind: Pod
metadata:
  name: db
  labels:
    podinfo: pod-db
spec:
  containers:
    - name: db-cont
      image: postgres:15-alpine
      ports:
        - containerPort: 5432
      env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        - name: POSTGRES_DB
          value: postgres
